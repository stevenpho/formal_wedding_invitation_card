<!doctype html><meta charset="utf-8"><title>loading-test</title>
<!-- 搭配慢速影片伺服器:點蝴蝶結後 1 秒內影片未開始,intro 應有 .loading;影片開始播放或略過開場後 .loading 應移除。 -->
<iframe id="f" src="../index.html" style="width:390px;height:844px"></iframe>
<pre id="out">running</pre>
<script>
var f = document.getElementById('f'), r = {};
f.onload = function () {
  var d = f.contentDocument, i = d.getElementById('intro'), v = d.getElementById('vid');
  setTimeout(function () { i.click(); }, 1500);
  setTimeout(function () { r.at1s = i.classList.contains('loading'); }, 2800);
  setTimeout(function () { r.playing = !v.paused && v.currentTime > 0.1; r.afterPlay = i.classList.contains('loading') || i.classList.contains('swing'); 
    document.getElementById('out').textContent = 'RESULT ' + (r.at1s === true && !i.classList.contains('loading') ? 'PASS' : 'FAIL') + ' ' + JSON.stringify(r); }, 9000);
};
</script>
